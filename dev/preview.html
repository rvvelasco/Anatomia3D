<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#223}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { buildSkeleton, buildCartilage, buildTeeth, buildCavities } from '../js/model/skeleton.js';
const q = new URLSearchParams(location.search);
const view = q.get('view')||'front', tgt=(q.get('t')||'0,100,0').split(',').map(Number), dist=+(q.get('d')||230);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(900,1000); document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background=new THREE.Color('#223');
sc.add(new THREE.HemisphereLight(0xffffff,0x444455,1.6)); const dl=new THREE.DirectionalLight(0xffffff,1.6); dl.position.set(50,100,120); sc.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.8); dl2.position.set(-50,50,-120); sc.add(dl2);
const bm = new THREE.MeshStandardMaterial({color:'#e9dfc6',roughness:.6,side:THREE.DoubleSide});
window.errs=[];
try{
for (const p of buildSkeleton()) { const m=new THREE.Mesh(p.geo,bm); sc.add(m);}
sc.add(new THREE.Mesh(buildTeeth(), new THREE.MeshStandardMaterial({color:'#fffdf5'}))); sc.add(new THREE.Mesh(buildCavities(), new THREE.MeshStandardMaterial({color:'#2a1d1a'})));
sc.add(new THREE.Mesh(buildCartilage(), new THREE.MeshStandardMaterial({color:'#9fc3d6'})));
if (q.get('muscles')) { const mod = await import('../js/model/muscles.js'); for (const p of mod.buildMuscles()) { const m=new THREE.Mesh(p.geo,new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.0+Math.random()*0.03,0.55,0.38+Math.random()*0.08),roughness:.5, side:THREE.DoubleSide})); if(!q.get('only')||p.id.includes(q.get('only'))) sc.add(m);} }
}catch(e){window.errs.push(String(e.stack||e));}
const cam = new THREE.PerspectiveCamera(30,0.9,1,2000);
const dirs={front:[0,0,1],back:[0,0,-1],right:[-1,0,0],left:[1,0,0],top:[0,1,0.01],q:[0.7,0.2,0.7],bottom:[0,-1,0.01]};
const d=new THREE.Vector3(...dirs[view]).normalize().multiplyScalar(dist);
cam.position.set(tgt[0]+d.x,tgt[1]+d.y,tgt[2]+d.z); cam.lookAt(...tgt);
r.render(sc,cam); window.done=true;
</script></body></html>
